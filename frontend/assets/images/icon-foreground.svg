<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024" role="img" aria-label="Nook">
  <g transform="translate(50 50) scale(0.6) translate(-50 -50)">
    <path d="M50.9 34.7A20 20 0 1 0 50.9 65.3" fill="none" stroke="#FF7A3D" stroke-width="9" stroke-linecap="round"/>
    <circle cx="56" cy="50" r="20" fill="none" stroke="#FFA166" stroke-width="9"/>
  </g>
</svg>
