# Cả cụm cho máy deploy / staging: Postgres · Redis · MinIO · migration · API · proxy.
# (Máy dev thì dùng compose.dev.yml — server chạy thẳng trên máy để watch.)
#
#   cp backend/docker/.env.example backend/docker/.env     # rồi điền bí mật
#   npm run stack:up                                        # = up -d --build
#   docker compose -f backend/docker/compose.yml up -d --scale api=3
#   npm run stack:down                                      # giữ dữ liệu; thêm -v là XOÁ SẠCH
#
# Thứ tự bật: db, redis, minio khoẻ → minio-init tạo thùng → migrate chạy xong
# → api → proxy. Migration là MỘT lần chạy riêng, không phải mỗi bản api tự
# chạy: ba bản api cùng tự chạy migration là đua nhau sửa bảng.
#
# Nhân bản api KHÔNG cần dính phiên ở proxy: ống socket chỉ nhận websocket (một
# kết nối, không có long-polling nhiều request), còn bắn chéo giữa các bản đi
# qua cầu Redis (`RedisIoAdapter`). Đếm online cũng ở Redis.
name: nook

x-api-image: &api-image
  build:
    context: ../..
    dockerfile: backend/Dockerfile
  image: nook-backend:${NOOK_TAG:-local}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER in backend/docker/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in backend/docker/.env}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in backend/docker/.env}
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=vi-VN --encoding=UTF8'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly: mã đăng nhập, hàng đợi việc nền không bay khi khởi động lại.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 30

  # Kho ảnh. Bản cho người dùng thật thì dùng R2 (backend/README mục 4) — khi đó
  # bỏ minio + minio-init và trỏ STORAGE_* sang R2.
  #
  # `minio/minio` và `minio/mc` KHÔNG còn trên Docker Hub (MinIO ngừng phát hành
  # image cộng đồng) — `pull access denied`. Dùng bản dựng cộng đồng, GHIM phiên
  # bản; có cả `minio` lẫn `mc` trong một image nên minio-init dùng lại được.
  minio:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${STORAGE_KEY_ID:?set STORAGE_KEY_ID in backend/docker/.env}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET:?set STORAGE_SECRET in backend/docker/.env}
    # App PUT/GET THẲNG vào kho bằng đường đã ký, nên điện thoại phải tới được
    # cổng này — và STORAGE_ENDPOINT phải là địa chỉ điện thoại thấy (xem .env.example).
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 30

  # Tạo thùng rồi thoát. Không có nó thì lần tải lên đầu tiên hỏng, và lúc bật
  # bản thật `StorageCheck` thấy thiếu thùng là dừng hẳn.
  minio-init:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${STORAGE_KEY_ID}:${STORAGE_SECRET}@minio:9000
      BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET in backend/docker/.env}
    entrypoint: ['/bin/sh', '-c', 'mc mb --ignore-existing "local/$${BUCKET}" && echo "bucket $${BUCKET} ready"']

  # Chạy migration MỘT lần bằng chính image của api, rồi thoát 0. api chỉ bật
  # sau khi cái này xong — bảng không tự dựng, thiếu bảng thì mọi đường chạm
  # bảng trả 500 trong khi /health vẫn xanh.
  migrate:
    <<: *api-image
    restart: 'no'
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command:
      - node
      - node_modules/typeorm/cli.js
      - -d
      - backend/dist/database/data-source/data-source.js
      - migration:run

  api:
    <<: *api-image
    restart: unless-stopped
    init: true
    env_file: .env
    # Không mở cổng ra máy chủ: nhân bản thì nhiều bản không giành được một
    # cổng. Mọi đường vào đi qua `proxy`.
    expose:
      - '4000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /health chạm thật Postgres + Redis; trả 200 cả khi hỏng nên phải đọc `data.ok`.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r=>r.json()).then(j=>process.exit(j.data&&j.data.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 20s

  # Cửa vào duy nhất. Chia đều sang mọi bản api (DNS của Docker trả đủ các bản),
  # và nâng kết nối lên websocket cho ống socket. TLS thì đặt thêm phía trước.
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      default:
        # Địa chỉ CỐ ĐỊNH để TRUST_PROXY khai đúng một máy, không phải cả mạng.
        ipv4_address: ${PROXY_IP:-172.30.0.10}

networks:
  default:
    ipam:
      config:
        - subnet: ${NOOK_SUBNET:-172.30.0.0/24}

volumes:
  db-data:
  redis-data:
  minio-data:
