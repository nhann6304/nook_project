# Cụm dịch vụ cho máy dev: Postgres + Redis + MinIO (+ Elasticsearch khi cần).
# Server KHÔNG nằm trong này — bạn tự chạy `npm run dev:be` trên máy để
# `nest start --watch` nạp lại tức thì.
#
#   npm run up              Postgres 5433 · Redis 6380 · MinIO 9000/9001
#   npm run up:search       thêm Elasticsearch 9200 (ăn ~1 GB RAM)
#   npm run down            tắt, GIỮ dữ liệu
#   npm run reset:db        XOÁ SẠCH dữ liệu rồi dựng lại
#
# Postgres trong Docker là MẶC ĐỊNH từ 10/10/2026 (`DB_PORT=5433` trong
# backend/.env). Máy đã có Postgres cài sẵn muốn dùng bản đó thì đổi về 5432.
#
# Cổng lệch chuẩn có chủ ý: 5433 / 6380 để không đụng Postgres / Redis có sẵn.
name: nook-dev

services:
  db:
    image: postgres:16-alpine
    container_name: nook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nook
      POSTGRES_PASSWORD: nook
      POSTGRES_DB: nook
      # Sắp xếp chữ theo chuẩn C cho nhanh và ổn định giữa các máy.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=vi-VN --encoding=UTF8'
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nook -d nook']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: nook-redis
    restart: unless-stopped
    # appendonly để mã đăng nhập không bay mất khi khởi động lại giữa chừng.
    # noeviction: chung Redis với BullMQ, đuổi khoá là mất việc nền.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'noeviction']
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Chỉ lên khi gọi tên: --profile search. Mật khẩu khớp backend/.env.example.
  elasticsearch:
    image: elasticsearch:8.19.20
    container_name: nook-es
    profiles: ['search']
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'true'
      xpack.security.http.ssl.enabled: 'false'
      xpack.security.transport.ssl.enabled: 'false'
      ELASTIC_PASSWORD: nook-elastic-dev
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 1g
    ports:
      - '127.0.0.1:9200:9200'
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS -u elastic:nook-elastic-dev "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null']
      interval: 10s
      timeout: 10s
      retries: 30

  # Kho ảnh của máy dev. Nói cùng thứ tiếng với Cloudflare R2 (giao thức S3),
  # nên đường tải lên ở máy dev là ĐƯỜNG THẬT — không phải một bản giả rồi lên
  # thật mới phát hiện lệch.
  # `minio/minio` · `minio/mc` đã rời Docker Hub — bản dựng cộng đồng, ghim phiên
  # bản, có cả `mc` (xem compose.yml).
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: nook-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: nook
      MINIO_ROOT_PASSWORD: nook12345
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Tạo sẵn thùng chứa rồi thoát. Không có nó thì lần tải lên đầu tiên hỏng vì
  # thùng chưa tồn tại, và câu lỗi của S3 lúc đó không chỉ ra được điều đó.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: nook-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 nook nook12345 &&
      mc mb --ignore-existing local/nook-media &&
      echo 'bucket nook-media ready'
      "

volumes:
  db-data:
  redis-data:
  minio-data:
  es-data:
