# Proxy trước các bản api (compose.yml). Một việc: chia request + nâng websocket.
worker_processes auto;
events { worker_connections 4096; }

http {
  # DNS của Docker. Hỏi lại mỗi 10 giây: `--scale api=N` đổi số bản thì proxy
  # thấy bản mới mà không phải khởi động lại.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Ảnh không đi qua đây (app PUT thẳng vào kho); JSON thì Fastify chặn ở 1 MB.
  client_max_body_size 2m;
  access_log off;

  server {
    listen 80;

    # Số liệu cho Prometheus TRONG cụm, không cho thế giới. api cũng tự chặn
    # (thấy X-Forwarded-For là 404) — đây là lớp thứ nhất.
    location = /metrics { return 404; }

    location / {
      # Biến chứ không phải tên cố định: nginx mới hỏi `resolver`, và chia đều
      # cho MỌI địa chỉ DNS trả về.
      set $api http://api:4000;
      proxy_pass $api;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      # Nối THÊM IP thật vào cuối; server chỉ tin hop cuối vì TRUST_PROXY là
      # đúng địa chỉ proxy này — header client tự gõ phía trước không được tin.
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Ống socket sống lâu; engine.io gửi nhịp tim mỗi 25 giây.
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }
  }
}
